name: ML Security CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-and-quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff bandit pip-audit

    - name: Lint code (Ruff)
      run: ruff check src/ tests/ --exit-zero

    - name: Static Analysis (Bandit)
      run: python -m bandit -r src/ -ll

    - name: Run Tests (pytest)
      run: python -m pytest tests/ -v

    - name: Dependency Audit (pip-audit)
      run: pip-audit -r requirements.txt

    - name: Data Quality Gate
      run: python src/check_data.py data/ci_sample.csv

    - name: Model Quality Gate
      run: |
        echo '{"f1_macro": 0.75}' > metrics/candidate.json
        python src/check_model.py metrics/baseline.json metrics/candidate.json

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t ml-project:lab3 .

    - name: Run Smoke Test
      run: docker run --rm ml-project:lab3

    - name: Install Trivy Scanner
      uses: aquasecurity/setup-trivy@v0
      with:
        version: latest

    - name: Security Gate (Trivy Image Scan)
      run: |
        trivy image --download-db-only --db-repository ghcr.io/aquasecurity/trivy-db:2
        trivy image --severity CRITICAL --exit-code 1 --skip-db-update --ignorefile .trivyignore ml-project:lab3
